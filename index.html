<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="Tautan proyek Smart Greenhouse: repository firmware, dashboard, demo live, dan Instagram.">
  <title>Smart Greenhouse — Tautan Proyek</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #212121;
      background: #f5f7fa;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --blue: #1565c0;
      --muted: #616b78;
      --border: #dce3eb;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px 16px; }
    main { width: min(100%, 720px); }
    .panel { padding: clamp(26px, 6vw, 52px); border: 1px solid #d7e5f4; border-radius: 26px; background: linear-gradient(145deg, #eaf4ff, #fff 70%); box-shadow: 0 18px 50px rgba(25, 65, 105, .08); }
    .eyebrow { margin: 0 0 12px; color: var(--blue); font-size: .76rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1.04; letter-spacing: -.06em; }
    .intro { max-width: 520px; margin: 16px 0 28px; color: var(--muted); line-height: 1.65; }
    nav { display: grid; gap: 10px; }
    a { display: flex; min-height: 58px; align-items: center; justify-content: flex-start; gap: 13px; padding: 14px 17px; border: 1px solid var(--border); border-radius: 14px; background: #fff; color: #173a5e; font-weight: 700; text-decoration: none; transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease; }
    a:hover { transform: translateY(-2px); border-color: #9fc3e9; box-shadow: 0 8px 22px rgba(32, 72, 112, .09); }
    .icon { width: 22px; height: 22px; flex: 0 0 22px; color: var(--blue); }
    footer { margin-top: 20px; color: var(--muted); font-size: .85rem; text-align: center; }
    :focus-visible { outline: 3px solid #e8a900; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="title">
      <p class="eyebrow">Proyek Capstone · Smart Agriculture</p>
      <h1 id="title">Smart Greenhouse</h1>
      <p class="intro">Sistem greenhouse cabai berbasis ESP32 dan dashboard web untuk pemantauan serta kendali.</p>
      <nav aria-label="Tautan proyek">
        <a href="https://www.instagram.com/tirtaweda/" target="_blank" rel="noopener noreferrer">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"/></svg>
          <span>Instagram @tirtaweda</span>
        </a>
        <a href="https://smartgh-manager.pages.dev/" target="_blank" rel="noopener noreferrer">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18m-13 4h3m-3 3h6"/></svg>
          <span>Dashboard live</span>
        </a>
        <a href="https://github.com/will-zx/smartgh-firmware" target="_blank" rel="noopener noreferrer">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 9h6v6H9zM9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/></svg>

          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.12.08 1.71 1.15 1.71 1.15 1 .1.77 2.05 3.37 1.52.1-.73.39-1.22.7-1.5-2.5-.28-5.13-1.25-5.13-5.57 0-1.23.44-2.24 1.15-3.03-.12-.28-.5-1.44.11-2.99 0 0 .94-.3 3.08 1.16a10.7 10.7 0 0 1 5.61 0c2.14-1.46 3.08-1.16 3.08-1.16.61 1.55.23 2.71.11 2.99.72.79 1.15 1.8 1.15 3.03 0 4.33-2.63 5.29-5.14 5.57.4.35.75 1.03.75 2.08v3.1c0 .3.2.65.78.54A11.2 11.2 0 0 0 12 .8Z"/></svg>
          <span>Repo dashboard web</span>
        </a>
      </nav>
    </section>
    <footer>Smart Greenhouse · Tautan resmi proyek</footer>
  </main>
</body>
</html>
